apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: release-name
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: mediawiki
    app.kubernetes.io/version: 1.42.1
    helm.sh/chart: mediawiki-21.0.5
  name: release-name-mediawiki
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: release-name
      app.kubernetes.io/name: mediawiki
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: release-name
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: mediawiki
        app.kubernetes.io/version: 1.42.1
        helm.sh/chart: mediawiki-21.0.5
    spec:
      affinity:
        nodeAffinity: null
        podAffinity: null
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/instance: release-name
                  app.kubernetes.io/name: mediawiki
              topologyKey: kubernetes.io/hostname
            weight: 1
      automountServiceAccountToken: false
      containers:
      - env:
        - name: BITNAMI_DEBUG
          value: "false"
        - name: ALLOW_EMPTY_PASSWORD
          value: "yes"
        - name: MARIADB_HOST
          value: release-name-mariadb
        - name: MARIADB_PORT_NUMBER
          value: "3306"
        - name: MEDIAWIKI_DATABASE_NAME
          value: bitnami_mediawiki
        - name: MEDIAWIKI_DATABASE_USER
          value: bn_mediawiki
        - name: MEDIAWIKI_DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              key: mariadb-password
              name: release-name-mariadb
        - name: MEDIAWIKI_HOST
          value: example.com
        - name: MEDIAWIKI_USERNAME
          value: user
        - name: MEDIAWIKI_PASSWORD
          valueFrom:
            secretKeyRef:
              key: mediawiki-password
              name: release-name-mediawiki
        - name: MEDIAWIKI_EMAIL
          value: user@example.com
        - name: MEDIAWIKI_WIKI_NAME
          value: My Wiki
        - name: APACHE_HTTP_PORT_NUMBER
          value: "8080"
        - name: APACHE_HTTPS_PORT_NUMBER
          value: "8443"
        image: docker.io/bitnami/mediawiki:1.42.1-debian-12-r3
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 6
          initialDelaySeconds: 120
          periodSeconds: 10
          successThreshold: 1
          tcpSocket:
            port: http
          timeoutSeconds: 5
        name: release-name-mediawiki
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 8443
          name: https
        readinessProbe:
          failureThreshold: 6
          httpGet:
            httpHeaders:
            - name: Host
              value: example.com
            path: /api.php?action=query&meta=siteinfo&format=none
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 375m
            ephemeral-storage: 2Gi
            memory: 384Mi
          requests:
            cpu: 250m
            ephemeral-storage: 50Mi
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
          runAsGroup: 1001
          runAsNonRoot: true
          runAsUser: 1001
          seLinuxOptions: {}
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /opt/bitnami/apache/conf
          name: empty-dir
          subPath: apache-conf-dir
        - mountPath: /opt/bitnami/apache/logs
          name: empty-dir
          subPath: apache-logs-dir
        - mountPath: /opt/bitnami/apache/var/run
          name: empty-dir
          subPath: apache-tmp-dir
        - mountPath: /opt/bitnami/php/etc
          name: empty-dir
          subPath: php-conf-dir
        - mountPath: /opt/bitnami/php/tmp
          name: empty-dir
          subPath: php-tmp-dir
        - mountPath: /opt/bitnami/php/var
          name: empty-dir
          subPath: php-var-dir
        - mountPath: /tmp
          name: empty-dir
          subPath: tmp-dir
        - mountPath: /opt/bitnami/mediawiki
          name: empty-dir
          subPath: app-base-dir
        - mountPath: /bitnami/mediawiki
          name: mediawiki-data
          subPath: mediawiki
      hostAliases:
      - hostnames:
        - status.localhost
        ip: 127.0.0.1
      initContainers:
      - args:
        - -ec
        - |
          #!/bin/bash

          . /opt/bitnami/scripts/liblog.sh
          . /opt/bitnami/scripts/libfs.sh

          info "Copying base dir to empty dir"
          # In order to not break the application functionality (such as upgrades or plugins) we need
          # to make the base directory writable, so we need to copy it to an empty dir volume
          cp -r --preserve=mode /opt/bitnami/mediawiki /emptydir/app-base-dir

          info "Copying symlinks to stdout/stderr"
          # We copy the logs folder because it has symlinks to stdout and stderr
          if ! is_dir_empty /opt/bitnami/apache/logs; then
            cp -r /opt/bitnami/apache/logs /emptydir/apache-logs-dir
          fi
          info "Copy operation completed"
        command:
        - /bin/bash
        image: docker.io/bitnami/mediawiki:1.42.1-debian-12-r3
        imagePullPolicy: IfNotPresent
        name: prepare-base-dir
        resources:
          limits:
            cpu: 375m
            ephemeral-storage: 2Gi
            memory: 384Mi
          requests:
            cpu: 250m
            ephemeral-storage: 50Mi
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
          runAsGroup: 1001
          runAsNonRoot: true
          runAsUser: 1001
          seLinuxOptions: {}
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /emptydir
          name: empty-dir
      priorityClassName: ""
      securityContext:
        fsGroup: 1001
        fsGroupChangePolicy: Always
        supplementalGroups: []
        sysctls: []
      serviceAccountName: release-name-mediawiki
      volumes:
      - emptyDir: {}
        name: empty-dir
      - name: mediawiki-data
        persistentVolumeClaim:
          claimName: release-name-mediawiki-mediawiki
