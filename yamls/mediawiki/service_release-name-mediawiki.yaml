apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/instance: release-name
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: mediawiki
    app.kubernetes.io/version: 1.42.1
    helm.sh/chart: mediawiki-21.0.5
  name: release-name-mediawiki
  namespace: default
spec:
  externalTrafficPolicy: Cluster
  ports:
  - name: http
    port: 80
    targetPort: http
  - name: https
    port: 443
    targetPort: https
  selector:
    app.kubernetes.io/instance: release-name
    app.kubernetes.io/name: mediawiki
  sessionAffinity: None
  type: LoadBalancer
